[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atex"
description = "Ad-hoc Test EXecution"
readme = "README.md"
version = "99"
license = "GPL-3.0-or-later"
requires-python = ">= 3.12"
dependencies = [
    "urllib3 >= 2, < 3",
    "fmf >= 1.6",
    "PyYAML",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/RHSecurityCompliance/atex"

[project.scripts]
atex = "atex:cli.main"

[tool.hatch.build.targets.wheel]
only-include = ["atex"]
exclude = [
    "*.md",
    "tests/*",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests", "."]
python_functions = "test_*"  # default is test*
python_classes = "Test_*"    # default is Test*
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s.%(msecs)03d %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s.%(msecs)03d %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle
    "W",    # pycodestyle
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "EXE",  # flake8-executable
    "I",    # isort
    "PIE",  # flake8-pie
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "FURB", # refurb
]
ignore = [
    "builtin-open",
    "if-else-block-instead-of-if-exp",
    "collapsible-if",
    "multiple-with-statements",
    "if-else-block-instead-of-dict-get",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-boolean-expressions",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "too-many-statements-in-try-clause",
    "magic-value-comparison",
    "collapsible-else-if",
    "global-statement",
    "subprocess-run-without-check",
    "redefined-loop-name",
    "explicit-f-string-type-conversion",
    "mutable-class-default",
    "non-empty-init-module",
    "unsorted-dunder-all",
    "needless-bool",
    "suppressible-exception",
    "open-file-with-context-handler",
    "read-whole-file",
    "reimplemented-operator",

    # rules from preview
    "no-indented-block-comment",
    "missing-whitespace-around-arithmetic-operator",
    "missing-whitespace",
    "no-space-after-block-comment",
    "multiple-leading-hashes-for-block-comment",
    "literal-membership",
    "unspecified-encoding",
    "eq-without-hash",
    "noqa-comments",

    # buggy in ruff, inconsistent across ruff versions
    "unused-noqa",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

#[tool.ruff.lint.pycodestyle]
# keep docstrings within "standard" width
# - disabled because it also applies to # comments :(
#max-doc-length = 80
